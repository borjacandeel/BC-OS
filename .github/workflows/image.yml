name: Imagen (ARM64 y x86_64)

# Construye la imagen de BC OS en un runner ARM64 NATIVO (sin qemu-user: el chroot de Arch Linux ARM corre directo).
# Solo publica un prerelease si se marca "publicar" (o si se hace push de build/PUBLICAR).
# Pasos largos: build-all.sh descarga el rootfs de Arch Linux ARM, instala paquetes con pacman, compila BC Shell
# (Qt 6) y swayfx con meson dentro del chroot, y monta la imagen. En ARM64 nativo tarda ~15-25 min; con qemu-user
# (x86_64) sería bastante más, por eso el timeout del trabajo es holgado.
on:
  push:
    branches: [main]
    paths: ['build/PUBLICAR']
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. 0.1.0-alpha)"
        required: false
        default: "0.1.0-alpha"
      publicar:
        description: "Publicar como PRERELEASE en GitHub Releases"
        type: boolean
        default: false

# contents: write es necesario SOLO para crear el release y subir los ficheros.
permissions:
  contents: write

# Nunca dos construcciones/publicaciones a la vez (se usa el mismo tag v<versión>). No se cancela la que está en curso.
concurrency:
  group: imagen-bcos
  cancel-in-progress: false

jobs:
  imagen:
    name: Imagen BC OS (${{ matrix.suf }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            suf: ARM64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            suf: x86_64
            runner: ubuntu-24.04
    env:
      BC_ARCH: ${{ matrix.arch }}
      BC_ISO: "1"
      # Solo ISO live (instalador), sin disco VDI: lo que pide el creador desde 0.9.17
      BC_SOLO_ISO: "1"
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    # Límite total del trabajo (descarga + pacman + compilaciones + imagen + subida). Cada paso largo tiene además el suyo.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Resolver versión y modo
        id: v
        # Los valores externos (inputs, fichero PUBLICAR) pasan por variables de entorno y se validan:
        # así no se interpolan directamente en el shell (evita inyección de comandos).
        env:
          EVENTO: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLICAR: ${{ inputs.publicar }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            version="$(tr -d ' \n\r' < build/PUBLICAR)"; publicar=true
          else
            version="$IN_VERSION"; publicar="$IN_PUBLICAR"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::versión no válida: «$version» (se espera p. ej. 0.3.2 o 0.3.2-alpha)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "Versión: $version · publicar: $publicar"
      - name: Verificar arquitectura
        run: test "$(uname -m)" = "$BC_ARCH"
      - name: Liberar disco
        # La construcción necesita ~12-15 GB libres a la vez (rootfs + copia ext4 + imagen raw de 6 GiB + VDI + zip).
        # Se borran herramientas preinstaladas que no se usan y se limpian imágenes de Docker y caché de apt.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/microsoft /usr/lib/jvm /usr/local/julia* 2>/dev/null || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h /
          libre_gb=$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')
          echo "Espacio libre: ${libre_gb} GB"
          if [ "$libre_gb" -lt 20 ]; then echo "::warning::solo ${libre_gb} GB libres; la imagen podría quedarse sin espacio"; fi
      - name: Instalar herramientas
        # Herramientas del ANFITRIÓN (lo de dentro del chroot lo instala pacman):
        # libarchive-tools=bsdtar (rootfs de ALARM), dosfstools+mtools (ESP FAT32), e2fsprogs (mkfs.ext4 -d), fdisk (sfdisk),
        # qemu-utils (qemu-img → VDI), rsync, zip, curl+ca-certificates (descargas: ALARM y tema de cursores de GitHub),
        # xz-utils (tar -xJ del tema de cursores), zstd, util-linux (mountpoint, mount).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools dosfstools mtools e2fsprogs fdisk zstd qemu-utils rsync curl ca-certificates zip xz-utils util-linux git python3-pil librsvg2-bin squashfs-tools xorriso
      - name: Compilar BC Core (Rust)
        # build-core.sh reutiliza core/target/release si ya existe (en aarch64), así sudo no necesita cargo/rustup.
        timeout-minutes: 30
        run: cd core && cargo build --release --locked
      - name: Construir imagen
        # Necesita root (chroot, mount, rsync -aHAX). Directorio de trabajo en $RUNNER_TEMP (mismo disco que el repo).
        # 120 min como tope: nativo suele tardar 15-25 min; el margen cubre descargas lentas del mirror de ALARM.
        timeout-minutes: 120
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: sudo -E build/build-all.sh "$VERSION" "$RUNNER_TEMP/bcwork"
      - name: Verificar integridad
        # Comprueba la suma SHA256 de la ISO y que existan los ficheros que se van a publicar.
        run: |
          cd build/out
          ls -lh
          ls ./*.iso >/dev/null
          sha256sum --check SHA256SUMS-*
      - name: Limpiar montajes huérfanos
        if: always()
        # Si el build falló a medias pueden quedar montajes de proc/sys/dev en el chroot.
        run: |
          for d in dev sys proc; do sudo umount -R -l "$RUNNER_TEMP/bcwork/root/$d" 2>/dev/null || true; done
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bc-os-${{ matrix.suf }}-${{ steps.v.outputs.version }}
          path: |
            build/out/*.zip
            build/out/*.iso
            build/out/SHA256SUMS-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publicar:
    name: Publicar prerelease (ARM64 + x86_64)
    needs: imagen
    if: ${{ always() && needs.imagen.outputs.publicar == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Preparar notas
        env:
          VERSION: ${{ needs.imagen.outputs.version }}
        run: |
          sed -i "s/@VERSION@/$VERSION/g" build/RELEASE-NOTES.md
          ! grep -q '@VERSION@' build/RELEASE-NOTES.md
          cat out/SHA256SUMS-* > out/SHA256SUMS; ls -lh out
      - name: Publicar prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.imagen.outputs.version }}
          name: BC OS ${{ needs.imagen.outputs.version }} (ARM64 y x86_64)
          prerelease: true
          body_path: build/RELEASE-NOTES.md
          files: |
            out/*.zip
            out/*.iso
            out/SHA256SUMS
