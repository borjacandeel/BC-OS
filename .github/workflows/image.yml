name: Imagen ARM64

# Construye la imagen de BC OS (runner ARM64 nativo). Solo publica un prerelease si se marca "publicar".
on:
  push:
    branches: [main]
    paths: ['build/PUBLICAR']
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. 0.1.0-alpha)"
        required: false
        default: "0.1.0-alpha"
      publicar:
        description: "Publicar como PRERELEASE en GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  imagen:
    name: Imagen BC OS (ARM64 nativo)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Resolver versión y modo
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=$(tr -d ' \n' < build/PUBLICAR)" >> "$GITHUB_OUTPUT"; echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; echo "publicar=${{ inputs.publicar }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Verificar arquitectura
        run: test "$(uname -m)" = "aarch64"
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true; df -h /
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools dosfstools mtools e2fsprogs fdisk zstd qemu-utils rsync curl ca-certificates zip
      - name: Construir imagen
        run: sudo build/build-all.sh "${{ steps.v.outputs.version }}" "$RUNNER_TEMP/bcwork"
      - name: Verificar integridad
        run: cd build/out && sha256sum --check SHA256SUMS
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bc-os-arm64-${{ steps.v.outputs.version }}
          path: |
            build/out/*.zip
            build/out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preparar notas
        run: sed -i 's/@VERSION@/${{ steps.v.outputs.version }}/g' build/RELEASE-NOTES.md
      - name: Publicar prerelease
        if: ${{ steps.v.outputs.publicar == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: BC OS ${{ steps.v.outputs.version }} (ARM64)
          prerelease: true
          body_path: build/RELEASE-NOTES.md
          files: |
            build/out/*.zip
            build/out/SHA256SUMS
