name: Repositorio [bc]

# Construye los paquetes de BC OS (bc-shell, bc-core, bc-escritorio y el metapaquete bc-os) en un chroot de
# Arch Linux ARM sobre un runner ARM64 nativo y los publica como repositorio pacman en la release «repo»
# (https://github.com/borjacandeel/BC-OS/releases/download/repo-<arch>), para aarch64 y x86_64. El sistema se actualiza desde ahí con bc-actualizar.
on:
  push:
    branches: [main]
    paths: ['shell/**', 'core/**', 'build/overlay/**', 'build/overlay-dotfiles/**', 'build/plymouth/**', 'build/repo/**', 'assets/**', 'build/packages/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-bc
  cancel-in-progress: false

jobs:
  repo:
    name: Paquetes y base de datos [bc] (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    env:
      BC_ARCH: ${{ matrix.arch }}
      HAY_CLAVE: ${{ secrets.BC_REPO_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools curl ca-certificates xz-utils zstd
      - name: Compilar BC Core (Rust)
        run: cd core && cargo build --release --locked
      - name: Rootfs de Arch
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/root"
          sudo -E bash -c "source build/lib/chroot.sh; source build/lib/rootfs.sh; bc_rootfs $R; bc_mount $R; bc_rootfs_keys $R
            bc_chroot $R pacman -Syu --noconfirm --disable-sandbox; bc_umount $R"
      - name: Construir paquetes
        run: |
          VER="$(date -u +%Y%m%d.%H%M)"
          sudo -E bash build/repo/build-repo.sh "$RUNNER_TEMP/root" "$RUNNER_TEMP/repo" "$VER"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/repo"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Firmar paquetes y base de datos (clave del creador, secreto BC_REPO_GPG_KEY)
        if: env.HAY_CLAVE == 'true'
        env:
          BC_REPO_GPG_KEY: ${{ secrets.BC_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$BC_REPO_GPG_KEY" | gpg --batch --import
          KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          cd "$RUNNER_TEMP/repo"
          for f in *.pkg.tar.zst bc.db bc.files bc.db.tar.gz bc.files.tar.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --detach-sign --no-armor -u "$KEY" "$f"
          done
          rm -rf "$GNUPGHOME"; ls *.sig
      - name: Publicar en la release «repo»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repo-${{ matrix.arch }}
          name: Repositorio de paquetes [bc] (${{ matrix.arch }})
          prerelease: true
          make_latest: false
          body: |
            Repositorio pacman de BC OS (${{ matrix.arch }}). No es una versión para descargar: lo usa el sistema.
            ```
            [bc]
            SigLevel = Required
            Server = https://github.com/borjacandeel/BC-OS/releases/download/repo-$arch
            ```
            Actualizar: `sudo bc-actualizar` (o Tienda ▸ Actualizaciones). Última construcción: ${{ env.VER }}
          files: |
            ${{ runner.temp }}/repo/*
