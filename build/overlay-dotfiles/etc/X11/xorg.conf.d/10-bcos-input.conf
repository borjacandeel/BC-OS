Section "InputClass"
    Identifier "BC OS libinput"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "on"
    Option "DisableWhileTyping" "on"
EndSection

Section "InputClass"
    Identifier "BC OS teclado"
    MatchIsKeyboard "on"
    Option "XkbLayout" "es"
EndSection
