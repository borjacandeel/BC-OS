# alacritty — terminal del entorno «Dotfiles» de BC OS
[window]
opacity = 0.92
decorations = "None"
dynamic_padding = true
padding = { x = 10, y = 8 }

[font]
size = 11.0
normal = { family = "CaskaydiaCove Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaCove Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaCove Nerd Font", style = "Italic" }

[scrolling]
history = 10000

[colors.primary]
background = "#0E1B26"
foreground = "#EAF1F5"

[colors.cursor]
cursor = "#8FC3D4"
text = "#0E1B26"

[colors.normal]
black = "#1B2B3A"
red = "#E2AAA0"
green = "#7FD4A0"
yellow = "#EBCB8B"
blue = "#5EA4D4"
magenta = "#B48EAD"
cyan = "#8FC3D4"
white = "#EAF1F5"

[cursor.style]
shape = "Beam"
blinking = "On"
