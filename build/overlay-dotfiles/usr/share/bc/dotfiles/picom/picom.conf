# picom — compositor del entorno «Dotfiles» de BC OS. Backend xrender: funciona sin GPU (VirtualBox/QEMU).
# Para desenfoque real hace falta GPU: pon backend = "glx", blur-background = true y vsync = true.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 14;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-opacity = 0.45;
shadow-exclude = [ "name = 'Notification'", "class_g = 'Conky'", "_GTK_FRAME_EXTENTS@" ];
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;
inactive-opacity = 0.96;
frame-opacity = 0.9;
active-opacity = 1.0;
corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
blur-background = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
detect-client-leader = true;
dbus = false;
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.92; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
