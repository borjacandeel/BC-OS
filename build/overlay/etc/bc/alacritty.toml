# Alacritty en BC OS (copia a ~/.config/alacritty/alacritty.toml para personalizar)
# Aspecto del Terminal de macOS (perfil oscuro): gris carbón casi opaco, texto claro, cursor de bloque.
# La paleta (clara u oscura, como el perfil «Básico» del Terminal de macOS) se importa y cambia en caliente
# con el aspecto del sistema: bc-appearance copia alacritty-oscuro.toml o alacritty-claro.toml.
[general]
import = ["~/.config/bc/alacritty-colores.toml"]
live_config_reload = true

[window]
opacity = 0.97
padding = { x = 6, y = 4 }
dimensions = { columns = 80, lines = 24 }
decorations = "Full"
dynamic_padding = true

[font]
size = 11
normal = { family = "DejaVu Sans Mono" }

[cursor.style]
shape = "Block"
blinking = "On"
