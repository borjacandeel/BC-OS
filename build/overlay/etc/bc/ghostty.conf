# Ghostty en BC OS con el aspecto del Terminal de macOS (perfil «Básico», oscuro).
# Copia a ~/.config/ghostty/config para personalizar.
font-family = DejaVu Sans Mono
font-family = CaskaydiaCove Nerd Font
font-size = 11
adjust-cell-height = 8%
background = #1e1e1e
foreground = #f2f2f2
background-opacity = 0.97
cursor-color = #c7c7c7
cursor-style = block
cursor-style-blink = false
selection-background = #3f638b
selection-foreground = #ffffff
palette = 0=#000000
palette = 1=#ff5f57
palette = 2=#28c840
palette = 3=#febc2e
palette = 4=#0a84ff
palette = 5=#bf5af2
palette = 6=#5ac8fa
palette = 7=#e5e5e7
palette = 8=#7d7d83
palette = 9=#ff6961
palette = 10=#30d158
palette = 11=#ffd60a
palette = 12=#409cff
palette = 13=#da8fff
palette = 14=#70d7ff
palette = 15=#ffffff
window-padding-x = 6
window-padding-y = 4
window-padding-balance = true
window-width = 92
window-height = 28
# Ventana con su barra de título: la del compositor (sway) o la propia con botones a la izquierda (Hyprland)
window-decoration = auto
gtk-titlebar = true
window-title-font-family = Inter
gtk-single-instance = false
confirm-close-surface = false
shell-integration = detect
copy-on-select = clipboard
mouse-hide-while-typing = true
