# Ghostty en BC OS (copia a ~/.config/ghostty/config para personalizar)
font-family = CaskaydiaCove Nerd Font
font-size = 11
background = #070d22
foreground = #e8ecf5
background-opacity = 0.82
cursor-color = #7b8cff
cursor-style = bar
selection-background = #2f7bff
selection-foreground = #ffffff
window-padding-x = 12
window-padding-y = 10
# sway dibuja la barra de título con los semáforos de BC OS
window-decoration = none
gtk-single-instance = false
confirm-close-surface = false
shell-integration = detect
copy-on-select = clipboard
