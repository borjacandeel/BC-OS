# Efectos de swayfx (solo con aceleración gráfica: kernel con bc.gpu=1): esquinas redondeadas, sombras y desenfoque
corner_radius 14
shadows enable
shadow_blur_radius 18
shadow_color #00000066
blur enable
blur_passes 2
blur_radius 5
default_dim_inactive 0.0
layer_effects "bc-dock" blur enable; corner_radius 30; shadows enable
layer_effects "bc-topbar" blur enable
layer_effects "bc-popups" blur enable
layer_effects "bc-notify" blur enable; corner_radius 22
# Las ventanas de BC ya dibujan su propio marco redondeado: sin sombra doble
for_window [app_id="bc-.*"] corner_radius 0; shadows disable; blur disable
