# Efectos de swayfx (equipo físico con GPU, o kernel con bc.gpu=1): esquinas, sombras y desenfoque.
# En «Equipo físico» bc-wm-mode añade «blur enable» detrás de las ventanas.
# Desenfoque y sombras cuestan mucha GPU: actívalos en ~/.config/bc/sway-user.conf si tu GPU los aguanta:
#   blur enable
#   blur_passes 2
#   blur_radius 5
#   shadows enable
# Golden Gate: radio único de ventana ≈20 pt
corner_radius 20
blur disable
blur_passes 2
blur_radius 6
# Golden Gate: sombra suave de ventana (como macOS); la activa un poco más marcada
shadows enable
shadow_blur_radius 24
shadow_color #00000066
shadow_inactive_color #00000040
layer_effects "bc-notify" "blur enable; blur_ignore_transparent enable"
# Liquid Glass real con GPU: desenfoque de lo que hay DETRÁS de las superficies del panel (no solo el fondo)
layer_effects "bc-popups" "blur enable; blur_ignore_transparent enable"
layer_effects "bc-dock" "blur enable; blur_ignore_transparent enable"
# Las ventanas de BC ya dibujan su propio marco redondeado
for_window [app_id="bc-.*"] corner_radius 0
