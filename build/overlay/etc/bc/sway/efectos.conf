# Efectos de swayfx (solo con aceleración gráfica: kernel con bc.gpu=1): esquinas redondeadas.
# Desenfoque y sombras cuestan mucha GPU: actívalos en ~/.config/bc/sway-user.conf si tu GPU los aguanta:
#   blur enable
#   blur_passes 2
#   blur_radius 5
#   shadows enable
corner_radius 20     # Golden Gate: radio único de ventana ≈20 pt
blur disable
shadows disable
layer_effects "bc-dock" corner_radius 20
layer_effects "bc-notify" corner_radius 20
# Liquid Glass real con GPU: desenfoque de lo que hay DETRÁS de las superficies del panel (no solo el fondo)
layer_effects "bc-topbar" blur enable
layer_effects "bc-popups" blur enable
# Las ventanas de BC ya dibujan su propio marco redondeado
for_window [app_id="bc-.*"] corner_radius 0
