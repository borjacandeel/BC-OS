<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- BC OS: CaskaydiaCove Nerd Font como fuente por defecto del sistema (interfaz, terminal y monoespaciada) -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>CaskaydiaCove Nerd Font</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>CaskaydiaCove Nerd Font</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>CaskaydiaCove Nerd Font Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
