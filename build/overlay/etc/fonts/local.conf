<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- BC OS (Golden Gate): Inter en la interfaz (métricas próximas a SF Pro); DejaVu Sans Mono (familia de Menlo) en terminal y monoespaciada -->
<fontconfig>
  <!-- Nitidez como macOS: suavizado en escala de grises (sin colores en los bordes), hinting ligero, sin mapas de bits -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>CaskaydiaCove Nerd Font</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Inter</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>CaskaydiaCove Nerd Font Mono</family></prefer></alias>
</fontconfig>
