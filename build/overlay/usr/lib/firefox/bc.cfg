// BC OS — primera línea de comentario obligatoria en autoconfig.
// Aplica bc-firefox.css a la interfaz de Firefox (no a las páginas): semáforo de macOS y esquinas redondeadas.
try {
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const uri = Services.io.newURI("file:///usr/lib/firefox/bc-firefox.css");
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  pref("bc.autoconfig.cargado", true);
} catch (e) { pref("bc.autoconfig.error", String(e)); }
