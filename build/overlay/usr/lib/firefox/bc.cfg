// BC OS — primera línea de comentario obligatoria en autoconfig.
// Aplica bc-firefox.css a la interfaz de Firefox (no a las páginas): semáforo de macOS y esquinas redondeadas.
try {
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const uri = Services.io.newURI("file:///usr/lib/firefox/bc-firefox.css");
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  pref("bc.autoconfig.cargado", true);
} catch (e) { pref("bc.autoconfig.error", String(e)); }

// Botones amarillo y verde bajo sway: sway ignora las peticiones de minimizar y maximizar de las ventanas Wayland
// (solo funcionaba el rojo). Se interceptan y se piden a BC OS: amarillo → minimizar al Dock (genio), verde →
// pantalla completa como macOS (otra vez, se sale). Con Hyprland no hace falta: él ya las atiende.
try {
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  if (env.exists("SWAYSOCK") && !env.exists("HYPRLAND_INSTANCE_SIGNATURE")) {
    const ejecutar = (prog, args) => {
      try {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(prog);
        if (!f.exists()) return false;
        const p = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
        p.init(f); p.runAsync(args, args.length);
        return true;
      } catch (e) { return false; }
    };
    const enganchar = (win) => {
      if (!win || win.__bcSemaforo || !win.document || win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
      win.__bcSemaforo = true;
      win.addEventListener("click", (ev) => {
        const b = ev.target && ev.target.closest && ev.target.closest(".titlebar-min, .titlebar-max, .titlebar-restore");
        if (!b || ev.button !== 0) return;
        const min = b.classList.contains("titlebar-min");
        const ok = min ? ejecutar("/usr/bin/bc-ctl", ["minimize"]) : ejecutar("/usr/bin/swaymsg", ["fullscreen", "toggle"]);
        if (ok) { ev.preventDefault(); ev.stopPropagation(); }
      }, true);
      // Doble clic en la barra de pestañas (zona vacía): pantalla completa como el verde
      win.addEventListener("dblclick", (ev) => {
        const t = ev.target;
        if (ev.button !== 0 || !t || !t.closest || !t.closest("#TabsToolbar, #titlebar") || t.closest("tab, toolbarbutton, .titlebar-button, #urlbar")) return;
        if (ejecutar("/usr/bin/swaymsg", ["fullscreen", "toggle"])) { ev.preventDefault(); ev.stopPropagation(); }
      }, true);
    };
    Services.obs.addObserver((subject) => {
      subject.addEventListener("load", () => enganchar(subject), { once: true });
    }, "domwindowopened");
    Services.obs.addObserver((subject) => enganchar(subject), "browser-delayed-startup-finished");
  }
} catch (e) { pref("bc.autoconfig.error2", String(e)); }
