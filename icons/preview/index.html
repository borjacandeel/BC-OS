<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconos BC OS</title>
<style>
:root {
  --bg: #F4F6FA; --panel: rgba(255,255,255,.8); --fg: #0B1220; --fg2: rgba(11,18,32,.62);
  --line: rgba(0,0,0,.10); --ctl: rgba(0,0,0,.06); --accent: #0A64F0; --tile: #FFFFFF;
  --wall: linear-gradient(160deg, #cfd8ea, #8fa3c7);
}
:root[data-theme="dark"] {
  --bg: #0B1019; --panel: rgba(22,33,58,.82); --fg: #F5F5F7; --fg2: rgba(245,245,247,.62);
  --line: rgba(255,255,255,.12); --ctl: rgba(255,255,255,.08); --accent: #2F7BFF; --tile: #141D31;
  --wall: radial-gradient(circle at 50% 30%, #3A4A66, #0B1019 75%);
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/20px Inter, "Noto Sans", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 12px 24px; background: var(--panel); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
input[type=search], select { height: 32px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--ctl); color: var(--fg); font: inherit; }
input[type=search] { width: 240px; }
label.ck { display: inline-flex; gap: 6px; align-items: center; color: var(--fg2); cursor: pointer; }
button { height: 32px; border: 0; border-radius: 10px; padding: 0 14px; background: var(--ctl); color: var(--fg); font: inherit; cursor: pointer; }
button:hover { background: var(--line); }
button[aria-pressed=true] { background: var(--accent); color: #fff; }
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 15px; margin: 28px 0 12px; display: flex; gap: 8px; align-items: baseline; }
h2 small { color: var(--fg2); font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 120px), 1fr)); gap: 10px; }
.cell { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
.cell:hover, .cell.sel { border-color: var(--accent); }
.cell .ic { position: relative; width: var(--sz); height: var(--sz); color: var(--fg); }
.cell .ic svg { width: 100%; height: 100%; display: block; }
.cell .nm { font-size: 11px; line-height: 14px; color: var(--fg2); text-align: center; word-break: break-all; }
.variants { display: flex; gap: 6px; }
.variants .ic { width: calc(var(--sz) * .6); height: calc(var(--sz) * .6); }
.ov { position: absolute; inset: 0; pointer-events: none; display: none; }
body.grid-on .ov { display: block; }
.ov svg { position: absolute; inset: 0; }
#detail { position: fixed; right: 16px; bottom: 16px; width: 300px; background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: none; z-index: 6; }
#detail.on { display: block; }
#detail code { display: block; font: 12px ui-monospace, "JetBrains Mono", monospace; background: var(--ctl); padding: 6px 8px; border-radius: 8px; margin: 6px 0; word-break: break-all; }
#detail .big { width: 128px; height: 128px; margin: 0 auto 8px; color: var(--fg); position: relative; }
#detail .big svg { width: 100%; height: 100%; }
.dockwrap { margin: 8px 0 0; border-radius: 22px; padding: 32px 16px 20px; background: var(--wall); display: flex; justify-content: center; }
.dock { display: flex; align-items: flex-end; gap: 14px; padding: 10px 14px; border-radius: 26px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(24px); }
.dock .di { width: 70px; height: 70px; transform-origin: 50% 100%; transition: transform .14s cubic-bezier(.2,0,0,1); display: block; position: relative; }
.dock .di svg { width: 100%; height: 100%; display: block; }
.dock .di.ph { display: grid; place-items: center; border-radius: 16px; background: rgba(255,255,255,.12); border: 1px dashed rgba(255,255,255,.35); color: rgba(255,255,255,.7); font-size: 10px; text-align: center; padding: 4px; }
.dock .di .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: rgba(30,30,34,.85); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; }
.dock .di:hover .tip { opacity: 1; }
.menubar { margin-top: 14px; display: flex; gap: 16px; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 12px; background: rgba(255,255,255,.35); color: var(--fg); }
.menubar .ic { width: 20px; height: 20px; }
.menubar svg { width: 100%; height: 100%; display: block; }
.empty { color: var(--fg2); padding: 24px; }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } input[type=search] { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Iconos BC OS</h1>
  <input id="q" type="search" placeholder="Buscar (nombre, etiqueta o tag)…" aria-label="Buscar">
  <select id="cat" aria-label="Categoría"></select>
  <label class="ck">Tamaño <input id="sz" type="range" min="16" max="128" step="4" value="48"> <output id="szo">48</output> px</label>
  <button id="theme" aria-pressed="false">Oscuro</button>
  <button id="gridbtn" aria-pressed="false">Rejilla</button>
  <button id="bg" aria-pressed="false">Claro sobre oscuro</button>
</header>
<main>
  <section>
    <h2>Dock simulado <small>iconos de app disponibles; pasa el ratón para ampliar (x1.6)</small></h2>
    <div class="dockwrap"><div class="dock" id="dock"></div></div>
    <div class="dockwrap" style="padding:14px;margin-top:12px"><div class="menubar" id="menubar"></div></div>
  </section>
  <div id="sections"></div>
</main>
<aside id="detail" aria-live="polite"></aside>
<script src="data.js"></script>
<script>
(function () {
  const D = window.BC_ICONS;
  if (!D) { document.body.innerHTML = '<p class="empty">Falta data.js: ejecuta <code>npm run build</code> en icons/.</p>'; return; }
  const M = D.manifest, $ = (s) => document.querySelector(s);
  const state = { q: '', cat: '', sz: 48, grid: false };
  const root = document.documentElement;
  try { const t = localStorage.getItem('bc-icons-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  if (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
  const syncTheme = () => { $('#theme').setAttribute('aria-pressed', root.dataset.theme === 'dark'); };
  syncTheme();
  $('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('bc-icons-theme', root.dataset.theme); } catch (e) {} syncTheme(); };

  const cats = M.categories.filter((c) => c.count);
  $('#cat').innerHTML = '<option value="">Todas las categorías</option>' + cats.map((c) => `<option value="${c.id}">${c.label} (${c.count})</option>`).join('');
  $('#cat').onchange = (e) => { state.cat = e.target.value; render(); };
  $('#q').oninput = (e) => { state.q = e.target.value.trim().toLowerCase(); render(); };
  $('#sz').oninput = (e) => { state.sz = +e.target.value; $('#szo').textContent = state.sz; document.body.style.setProperty('--sz', state.sz + 'px'); document.body.style.setProperty('--cell', Math.max(100, state.sz + 40) + 'px'); };
  $('#gridbtn').onclick = (e) => { state.grid = !state.grid; document.body.classList.toggle('grid-on', state.grid); e.target.setAttribute('aria-pressed', state.grid); };
  let inv = false;
  $('#bg').onclick = (e) => { inv = !inv; e.target.setAttribute('aria-pressed', inv); document.querySelectorAll('.cell').forEach((c) => { c.style.background = inv ? '#141D31' : ''; c.querySelector('.ic').style.color = inv ? '#F5F5F7' : ''; }); };
  $('#sz').oninput({ target: $('#sz') });

  function overlay(kind) {
    const vb = { symbolic: 24, color: 48, app: 1024 }[kind];
    let g = '';
    if (kind === 'symbolic') {
      g = '<path d="M' + [...Array(25).keys()].map((i) => `${i} 0V24M0 ${i}H24`).join('M') + '" stroke="#2F7BFF" stroke-opacity=".18" stroke-width=".05"/>' +
        '<rect x="2" y="2" width="20" height="20" fill="none" stroke="#FF5F57" stroke-width=".08"/>' +
        '<circle cx="12" cy="12" r="10" fill="none" stroke="#30D158" stroke-width=".08"/>' +
        '<rect x="3" y="3" width="18" height="18" fill="none" stroke="#FFB340" stroke-width=".08"/>' +
        '<rect x="2" y="4" width="20" height="16" fill="none" stroke="#B49CFF" stroke-width=".08"/>' +
        '<rect x="4" y="2" width="16" height="20" fill="none" stroke="#B49CFF" stroke-width=".08"/>';
    } else if (kind === 'color') {
      g = '<rect x="3" y="3" width="42" height="42" fill="none" stroke="#FF5F57" stroke-width=".15"/><circle cx="24" cy="24" r="19" fill="none" stroke="#30D158" stroke-width=".15"/><path d="M24 0V48M0 24H48" stroke="#2F7BFF" stroke-opacity=".4" stroke-width=".15"/>';
    } else {
      g = '<rect x="100" y="100" width="824" height="824" fill="none" stroke="#FF5F57" stroke-width="3"/><path d="M512 0V1024M0 512H1024" stroke="#2F7BFF" stroke-opacity=".5" stroke-width="3"/><circle cx="512" cy="512" r="300" fill="none" stroke="#30D158" stroke-width="3"/>';
    }
    return `<div class="ov"><svg viewBox="0 0 ${vb} ${vb}">${g}</svg></div>`;
  }
  const svgOf = (stem) => D.svgs[stem] || '';
  const hay = (i) => [i.name, i.label, i.category, ...i.tags].join(' ').toLowerCase();

  function render() {
    const list = M.icons.filter((i) => (!state.cat || i.category === state.cat) && (!state.q || hay(i).includes(state.q)));
    const by = {};
    list.forEach((i) => (by[i.category] = by[i.category] || []).push(i));
    const html = cats.filter((c) => by[c.id]).map((c) =>
      `<h2>${c.label} <small>${by[c.id].length} iconos · lote ${c.lote}</small></h2><div class="grid">` +
      by[c.id].map((i) => {
        const vs = Object.entries(i.variants);
        return `<div class="cell" data-id="${i.kind}|${i.name}" title="${i.label}"><div class="variants">` +
          vs.map(([v, stem]) => `<div class="ic" title="${stem}">${svgOf(stem)}${overlay(i.kind)}</div>`).join('') +
          `</div><div class="nm">${i.name}<br>${i.label}</div></div>`;
      }).join('') + '</div>').join('');
    $('#sections').innerHTML = html || '<p class="empty">Sin resultados.</p>';
    if (inv) { document.querySelectorAll('.cell').forEach((c) => { c.style.background = '#141D31'; c.querySelector('.ic').style.color = '#F5F5F7'; }); }
  }

  $('#sections').addEventListener('click', (e) => {
    const c = e.target.closest('.cell'); if (!c) return;
    document.querySelectorAll('.cell.sel').forEach((x) => x.classList.remove('sel')); c.classList.add('sel');
    const i = M.icons.find((x) => `${x.kind}|${x.name}` === c.dataset.id);
    const stem = i.variants.regular || i.variants.fill;
    $('#detail').innerHTML = `<div class="big">${svgOf(stem)}${overlay(i.kind)}</div><strong>${i.label}</strong>` +
      `<code>${Object.values(i.variants).join('\n')}</code><div>${i.kind} · ${M.kinds[i.kind].viewBox} · ${i.context || ''}</div><div style="color:var(--fg2)">${i.tags.join(', ')}</div>` +
      `<div style="margin-top:8px"><button id="cp">Copiar nombre</button> <button id="cl">Cerrar</button></div>`;
    $('#detail').classList.add('on');
    $('#cp').onclick = () => { try { navigator.clipboard.writeText(i.name); } catch (x) {} };
    $('#cl').onclick = () => $('#detail').classList.remove('on');
  });

  // Dock simulado: 8 huecos del shell (nombres Freedesktop objetivo)
  const DOCK = [['system-file-manager', 'Archivos'], ['preferences-system', 'Configuración'], ['utilities-system-monitor', 'Monitor'], ['utilities-terminal', 'Terminal'], ['system-software-install', 'Tienda'], ['web-browser', 'Navegador'], ['multimedia-audio-player', 'Música'], ['user-trash', 'Papelera']];
  const dock = $('#dock');
  dock.innerHTML = DOCK.map(([n, l]) => svgOf(n) ? `<a class="di" data-n="${n}"><span class="tip">${l}</span>${svgOf(n)}</a>` : `<a class="di ph"><span class="tip">${l}</span>${l}<br>(pendiente)</a>`).join('');
  const items = [...dock.children];
  dock.addEventListener('mousemove', (e) => items.forEach((el) => { const r = el.getBoundingClientRect(); const d = Math.abs(e.clientX - (r.left + r.width / 2)); const s = 1 + 0.6 * Math.max(0, 1 - d / 140); el.style.transform = `scale(${s.toFixed(3)})`; }));
  dock.addEventListener('mouseleave', () => items.forEach((el) => (el.style.transform = '')));

  // Barra de menús simulada con iconos de estado
  const MB = ['network-wireless-signal-excellent-symbolic', 'audio-volume-medium-symbolic', 'bluetooth-active-symbolic', 'battery-level-80-charging-symbolic', 'notification-symbolic', 'control-center-symbolic'];
  $('#menubar').innerHTML = MB.map((s) => `<span class="ic">${svgOf(s)}</span>`).join('');
  render();
})();
</script>
</body>
</html>
